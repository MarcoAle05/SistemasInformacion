version: '3.8'

services:
  web:
    image: php:8.2-apache
    ports:
      - "8080:80"
    volumes:
      - ../crud_pdo/public:/var/www/html
      - ../crud_pdo/config:/var/www/config
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    env_file:
      - ../.env
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crud_pdo
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db.sql:/docker-entrypoint-initdb.d/db.sql

volumes:
  db_data:
